name: Build → Push → Deploy

on:
  push:
    branches:
      - main        # runs every time you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build and push the image
      #    Tags: latest  +  the exact git commit SHA (so you can roll back)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bsads-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bsads-api:${{ github.sha }}

      # 4. Trigger Railway deployment
      - name: Deploy to Railway
        run: |
          curl -X POST https://api.railway.app/project/${{ secrets.RAILWAY_PROJECT_ID }}/service/${{ secrets.RAILWAY_SERVICE_ID }}/redeploy \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json"
